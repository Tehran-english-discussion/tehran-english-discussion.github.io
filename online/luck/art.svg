<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" fill="none">
  <defs>
    <linearGradient id="lk-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8DB36A"/><stop offset="1" stop-color="#3F6B34"/></linearGradient>
    <linearGradient id="lk-die" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF8EA"/><stop offset="1" stop-color="#E9D9BC"/></linearGradient>
    <linearGradient id="lk-coin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD84A"/><stop offset="1" stop-color="#C98F00"/></linearGradient>
    <radialGradient id="lk-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFC700" stop-opacity=".5"/><stop offset="1" stop-color="#FFC700" stop-opacity="0"/></radialGradient>
    <filter id="lk-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <!-- call window -->
  <rect x="60" y="40" width="680" height="480" rx="30" fill="#FFFDF8" stroke="#DCCDB2" stroke-width="3"/>
  <rect x="320" y="60" width="160" height="24" rx="12" fill="#F1E7D6"/>
  <circle cx="340" cy="72" r="5" fill="#E5484D"/>
  <rect x="352" y="68" width="110" height="8" rx="4" fill="#DCCDB2"/>
  <circle cx="400" cy="270" r="200" fill="url(#lk-glow)"/>
  <ellipse cx="400" cy="440" rx="200" ry="14" fill="#5A3A22" opacity=".25" filter="url(#lk-blur)"/>
  <!-- four-leaf clover -->
  <g stroke="#1A120C" stroke-width="4" stroke-linejoin="round">
    <path d="M400 300 C404 350 392 400 368 440" stroke-width="7" stroke-linecap="round" fill="none"/>
    
    <g fill="url(#lk-leaf)">
      <path d="M400 296 C360 290 318 250 336 214 C350 188 386 196 400 224 C414 196 450 188 464 214 C482 250 440 290 400 296Z" transform="rotate(0 400 296) translate(0 -2)"/>
      <path d="M400 296 C360 290 318 250 336 214 C350 188 386 196 400 224 C414 196 450 188 464 214 C482 250 440 290 400 296Z" transform="rotate(90 400 296)"/>
      <path d="M400 296 C360 290 318 250 336 214 C350 188 386 196 400 224 C414 196 450 188 464 214 C482 250 440 290 400 296Z" transform="rotate(180 400 296)"/>
      <path d="M400 296 C360 290 318 250 336 214 C350 188 386 196 400 224 C414 196 450 188 464 214 C482 250 440 290 400 296Z" transform="rotate(270 400 296)"/>
    </g>
    <circle cx="400" cy="296" r="9" fill="#FFC700"/>
  </g>
  <g stroke="#2A4A24" stroke-width="2.5" stroke-linecap="round" opacity=".7">
    <path d="M400 286 V236"/><path d="M410 296 H460"/><path d="M400 306 V356"/><path d="M390 296 H340"/>
  </g>
  <!-- die, left, tumbling -->
  <g transform="rotate(-16 200 380)" stroke="#1A120C" stroke-width="4">
    <rect x="148" y="328" width="104" height="104" rx="18" fill="url(#lk-die)"/>
    <g fill="#A63F2A" stroke="none"><circle cx="176" cy="356" r="9"/><circle cx="224" cy="356" r="9"/><circle cx="200" cy="380" r="9"/><circle cx="176" cy="404" r="9"/><circle cx="224" cy="404" r="9"/></g>
  </g>
  <!-- die, right, tumbling the other way -->
  <g transform="rotate(20 604 390)" stroke="#1A120C" stroke-width="4">
    <rect x="560" y="346" width="88" height="88" rx="16" fill="url(#lk-die)"/>
    <g fill="#1A120C" stroke="none"><circle cx="604" cy="390" r="10"/></g>
  </g>
  <!-- a coin mid-flip -->
  <g transform="translate(596 176)">
    <ellipse cx="0" cy="0" rx="34" ry="40" fill="url(#lk-coin)" stroke="#1A120C" stroke-width="4"/>
    <ellipse cx="0" cy="0" rx="22" ry="27" stroke="#8A5E00" stroke-width="3"/>
    <text x="0" y="11" text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="30" fill="#8A5E00">?</text>
  </g>
  <path d="M560 238 C548 262 552 290 566 310" stroke="#B8A386" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round" opacity=".7"/>
  <!-- sparkles -->
  <g fill="#D2A74C"><path d="M250 180 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4z"/><path d="M528 120 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/><path d="M296 470 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" opacity=".7"/><path d="M500 452 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" opacity=".8"/></g>
</svg>
