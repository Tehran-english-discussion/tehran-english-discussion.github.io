<style>
:root { --plaster: #F5EEE1; --fg: #2A1C12; --muted: #7B6650; --wall: #A63F2A; --on-dark: #F7EEDD; --line: #DCCDB2;
  --display: "Fraunces", Georgia, serif; --ui: "Instrument Sans", system-ui, sans-serif; }
@media (prefers-color-scheme: dark) { :root { --plaster: #1B1410; --fg: #F3E9D8; --muted: #B39F84; --wall: #C25A40; --line: #3A2C21; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; background: var(--plaster); color: var(--fg); font: 400 1rem/1.6 var(--ui); text-align: center; }
.n { font-family: var(--display); font-size: clamp(4.5rem, 22vw, 9rem); line-height: .9; color: var(--wall); font-weight: 300; font-variation-settings: "SOFT" 100, "WONK" 1; }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(1.6rem, 6vw, 2.4rem); margin: 10px 0 8px; }
p { color: var(--muted); max-width: 40ch; margin: 0 auto 26px; }
nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
a { padding: 10px 18px; border-radius: 99px; border: 1px solid var(--line); color: var(--fg); text-decoration: none; font-weight: 600; font-size: .92rem; }
a.main { background: var(--wall); border-color: var(--wall); color: var(--on-dark); }
</style>
</head>

</main>
